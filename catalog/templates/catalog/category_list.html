{% extends 'catalog/index.html' %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Магазин Шестерочка</h1>
    <h2 class="display-4">Категории</h2>
</div>
<div class="container">
    <div class="row text-center">
        {% for category in object_list %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ category.name_category }}</h4>
                </div>
                <div class="card-body">
                    <li>{{ category.description | truncatechars:10 }}</li>
                    </ul>
                    <a class="btn btn-primary" href="{% url 'catalog:product_list' %}"
                       role="button">Назад</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endblock %}
